[package]
name = "nova-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
nova-core = { path = "../nova-core" }
nova-kernel = { path = "../nova-kernel" }
nova-features = { path = "../nova-features" }
nova-sketch = { path = "../nova-sketch" }
nova-io = { path = "../nova-io" }

eframe = { version = "0.28", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true }
